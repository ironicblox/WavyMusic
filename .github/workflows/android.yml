name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/Wavy.Android/**'
      - 'src/Wavy.Core/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub's ubuntu-latest already has Android SDK at $ANDROID_SDK_ROOT
      # Just accept the licenses — no extra setup action needed
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore
        run: dotnet restore src/Wavy.Android/Wavy.Android.csproj

      - name: Build APK
        run: |
          dotnet publish src/Wavy.Android/Wavy.Android.csproj \
            -f net8.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -o ./artifacts/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wavy-Android-APK
          path: ./artifacts/android/*.apk
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
